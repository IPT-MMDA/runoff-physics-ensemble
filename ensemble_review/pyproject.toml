[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complexity-ensemble"
version = "0.1.0"
description = "Morse-routed heterogeneous ensembles for PINNs and neural differential equations"
license = { text = "Proprietary. All rights reserved. Any use requires prior written notice and express written permission; commercial use requires a separate prior written agreement. See the repository LICENSE." }
requires-python = ">=3.10"
dependencies = ["matplotlib", "numpy", "torch", "gradio>=6,<7", "plotly", "pandas", "geopandas"]

[project.scripts]
complexity-ensemble-app = "complexity_ensemble.app:main"
complexity-ensemble-run = "complexity_ensemble.regional_cli:main"
complexity-ensemble-api = "complexity_ensemble.api:main"
complexity-ensemble-worker = "complexity_ensemble.worker:main"
complexity-ensemble-studio = "complexity_ensemble.studio_server:main"

[tool.setuptools.package-data]
complexity_ensemble = ["design/*.css", "studio/*.html", "studio/*.css", "studio/*.js"]

[tool.setuptools.packages.find]
include = ["complexity_ensemble*"]

[project.optional-dependencies]
animations = ["Pillow"]
tda = ["ripser>=0.6"]
kan = ["pykan>=0.2.8"]
dev = ["pytest"]
api = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
